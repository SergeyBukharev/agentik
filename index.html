<!doctype html>
<html lang="ru" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
  <meta name="color-scheme" content="only light"/>
  <meta name="theme-color" content="#fcfdfb"/>
  <meta name="description" content="Agentik — AI-помощники для работы, творчества, обучения и повседневных дел. Меньше рутины. Больше жизни."/>
  <link rel="canonical" href="https://sergeybukharev.github.io/agentik/"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Agentik"/>
  <meta property="og:locale" content="ru_RU"/>
  <meta property="og:title" content="Agentik — меньше рутины, больше жизни"/>
  <meta property="og:description" content="AI-помощники для работы, творчества, обучения и повседневных дел."/>
  <meta property="og:url" content="https://sergeybukharev.github.io/agentik/"/>
  <meta property="og:image" content="https://sergeybukharev.github.io/agentik/brand/agentik-og.png"/>
  <meta property="og:image:type" content="image/png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:image:alt" content="Логотип Agentik"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <title>agentik — меньше рутины, больше жизни</title>
  <script src="/capture-guard.js" defer></script>
  <style>
    body { margin: 0; }
    .app-boot { box-sizing: border-box; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px; background: #fcfdfb; color: #242922; }
    .app-boot__body { display: grid; width: min(100%, 400px); gap: 14px; }
    .app-boot__mark { position:fixed;z-index:9999;inset-block-start:max(15px,env(safe-area-inset-top));inset-inline-start:max(18px,env(safe-area-inset-left));min-height:44px;display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;padding:4px 9px 4px 4px;border:1px solid #e7eae2;border-radius:14px;background:#fff;font:800 25px/1 system-ui,sans-serif;letter-spacing:-.045em; }
    .app-boot__mark img { display:block;width:35px;height:35px;border-radius:10px; }
    .app-boot__mark span { position:relative;inset-block-start:-3px; }
    @media (max-width: 820px), (max-width: 1024px) and (any-pointer: coarse), (any-pointer: coarse) and ((max-device-width: 600px) or ((max-device-width: 1200px) and (max-device-height: 600px))) {
      .app-boot__mark { inset-block-start:max(10px,env(safe-area-inset-top));inset-inline-start:max(13px,env(safe-area-inset-left)); }
    }
    .app-boot__body [data-skeleton-level] { position: relative; overflow: hidden; --boot-shine: #f9faf5; background: #ebefe7; }
    .app-boot__body [data-skeleton-level='media'] { --boot-shine: #eef6d6; background: #dce8cc; }
    .app-boot__body [data-skeleton-level]::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(106deg, transparent calc(22% - 44px),
        color-mix(in srgb, var(--boot-shine) 22%, transparent) 22%, var(--boot-shine) 51%,
        color-mix(in srgb, var(--boot-shine) 22%, transparent) 79%, transparent calc(79% + 44px));
      opacity: 0; transform: translateX(-105%); animation: boot-shimmer 1.6s ease-in-out 2;
    }
    .app-boot__bar { width: 64%; height: 14px; border-radius: 8px; }
    .app-boot__preview { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 13px; align-items: center; min-height: 62px; padding-inline: 12px; border-radius: 12px; }
    .app-boot__avatar { width: 34px; height: 34px; border-radius: 50%; }
    .app-boot__label { position: relative; width: min(70%, 140px); height: 8px; border-radius: 4px; background: #dae3d4; }
    @keyframes boot-shimmer {
      20%, 72% { opacity: .42; }
      to { opacity: 0; transform: translateX(105%); }
    }
    @media (prefers-reduced-motion: reduce) { .app-boot__body [data-skeleton-level]::before { animation: none; } }
    #__figma_capture_toolbar_host__, #__figma_h2d_chrome_extension_toolbar__,
    body[data-capture-blocked] > :not([data-capture-notice]) { display: none !important; }
    [data-capture-notice] { box-sizing: border-box; max-width: calc(100% - 36px); padding: 24px; border: 1px solid var(--line, #e7eae2); border-radius: 16px; background: var(--surface, #fff); color: var(--ink, #242922); text-align: center; font: 600 16px/1.5 system-ui, sans-serif; }
    [data-capture-notice]::backdrop { background: #171e1680; }
    [data-capture-notice] p { margin: 0 0 14px; }
    [data-capture-notice] button { min-height: 44px; padding: 8px 16px; border-radius: 9px; background: var(--lime, #d1f28b); color: #242922; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root" data-h2d-ignore="true">
    <div class="app-boot" role="status" aria-label="Загрузка Agentik">
      <span class="app-boot__mark" aria-hidden="true"><img src="/favicon.svg" alt="" width="35" height="35"/><span>agentik</span></span>
      <div class="app-boot__body" aria-hidden="true">
        <span class="app-boot__bar" data-skeleton-level="surface"></span>
        <span class="app-boot__preview" data-skeleton-level="surface">
          <span class="app-boot__avatar" data-skeleton-level="media"></span>
          <span class="app-boot__label"></span>
        </span>
      </div>
    </div>
  </div>
  <noscript><p>Включите JavaScript, чтобы открыть Agentik.</p></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
